# Compose for deployment (e.g. Portainer). For local development use `dotnet run` + vite (see README).
# The image is self-contained (sldl/yt-dlp/fpcalc/ffmpeg bundled); Portainer can deploy straight from the git repo.
# Set MUSIC_LIB and INBOX (host paths) plus SLDL_USER/SLDL_PASS as stack environment variables when deploying.
services:
  crate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: crate:latest
    container_name: crate
    # Downloaded files get this owner. Set CRATE_UID/CRATE_GID to your own user (`id -u`, `id -g`)
    # so the inbox stays writable/deletable over Samba/SFTP instead of being owned by root.
    user: "${CRATE_UID:-1000}:${CRATE_GID:-1000}"
    ports:
      # Host port is configurable (set CRATE_PORT if 8080 is taken); container always listens on 8080.
      - "${CRATE_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - DbPath=/data/crate.db
      - SldlPath=/usr/local/bin/sldl
      - MusicLibDir=/library/music
      - SldlIndexPath=/data/sldl_index.db
      # Soulseek credentials (set in .env or the Portainer stack env):
      - SLDL_USER=${SLDL_USER:-}
      - SLDL_PASS=${SLDL_PASS:-}
      # Optional AcoustID key enables fingerprint verification:
      - ACOUSTID_KEY=${ACOUSTID_KEY:-}
      # Verification tuning (optional): disable the YouTube-reference fingerprint or tune strictness.
      - VerifyYtFingerprint=${VerifyYtFingerprint:-}
      - VerifyBerThreshold=${VerifyBerThreshold:-}
    volumes:
      - ./data:/data
      # Your existing music library (read-only) for skip-music-dir + reconcile:
      - ${MUSIC_LIB:-./music-library}:/library/music:ro
      # Download inbox (set a source's destDir to /library/inbox in the app):
      - ${INBOX:-./inbox}:/library/inbox
      # Optional: use your own sldl binary instead of the bundled sockseek:
      # - ${SLDL_BIN:-/path/to/sldl}:/usr/local/bin/sldl:ro
    restart: unless-stopped
